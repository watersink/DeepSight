; ZLMediaKit 精简配置（Docker CPU 机）
; 与 docker/cpu/.env.example 中 ZLM_SECRET 保持一致

[api]
apiDebug=0
secret=b1CXeSHhB1AcYV5Hmf9e9h7nyHXsI9Tm
snapRoot=./www/snap/
defaultSnap=./www/logo.png

[general]
enableVhost=0
flowThreshold=1024
maxStreamWaitMS=15000
streamNoneReaderDelayMS=20000
mergeWriteMS=0
resetWhenRePlay=1
publishToHls=1
publishToMP4=0

[http]
rootPath=./www
port=80
sslport=443
charSet=utf-8
keepAliveSecond=30
maxReqSize=40960
notFound=<html><head><title>404 Not Found</title></head><body><h1>404 Not Found</h1></body></html>
dirMenu=1
forbidCacheSuffix=
allow_cross_domains=1
allow_ips=

[rtsp]
port=554
sslport=332
directProxy=1

[rtmp]
port=1935
sslport=19350
handshakeSecond=15
keepAliveSecond=15

[rtp]
audioMtuSize=600
videoMtuSize=1400
rtpMaxSize=10

[rtp_proxy]
port=10000
timeoutSec=15
h264_pt=96
h265_pt=98
ps_pt=96
opus_pt=100

[shell]
maxReqSize=1024
port=0

[hook]
enable=0

[protocol]
modify_stamp=2
enable_audio=1
add_mute_audio=1
auto_close=0
continue_push_ms=15000
paced_sender_ms=0
enable_hls=1
enable_hls_fmp4=0
enable_mp4=0
enable_rtsp=1
enable_rtmp=1
enable_ts=1
enable_fmp4=1
mp4_as_player=0
mp4_max_second=3600
mp4_save_path=./www/record/
hls_save_path=./www/record/
hls_seg_dur=2
hls_seg_num=3

[record]
appName=record
sampleMS=500
fileRepeat=0
fastStart=0
fileBufSize=65536
enableFmp4=0

[hls]
segDur=2
segNum=3
segRetain=5
broadcastRecordTs=0
deleteDelaySec=10

[srt]
port=9000
timeoutSec=5
latencyMul=4
pktBufSize=8192
